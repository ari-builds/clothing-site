<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="New arrivals every day. Order straight on WhatsApp." />
<title>Store — New Arrivals</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="brand" id="brandBtn" type="button">Brand</button>
    <a class="cta" id="headerWa" href="#" target="_blank" rel="noopener">Order on WhatsApp</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>Fresh drops. <em>Every day.</em></h1>
      <p>New arrivals land daily. Pick what you like and order straight on WhatsApp.</p>
    </div>
  </section>

  <section class="wrap">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No items yet — check back soon.</p>
  </section>
</main>

<footer>
  <div class="wrap">
    <p id="footerBrand">Brand</p>
    <a id="footerWa" href="#" target="_blank" rel="noopener">Message us on WhatsApp</a>
  </div>
</footer>

<script src="/app.js"></script>
</body>
</html>
